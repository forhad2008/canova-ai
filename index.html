    <script>
      (function() {
        function isViteWsError(err) {
          var str = String((err && (err.message || err)) || '');
          return str.indexOf('WebSocket') !== -1 || str.indexOf('vite') !== -1 || str === 'WebSocket closed without opened.';
        }
        window.addEventListener('unhandledrejection', function(event) {
          if (isViteWsError(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          if (isViteWsError(event.message || event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
